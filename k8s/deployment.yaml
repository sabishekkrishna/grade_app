apiVersion: apps/v1
kind: Deployment
metadata:
  name: grade-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grade
  template:
    metadata:
      labels:
        app: grade
    spec:
      containers:
      - name: grade-container
        image: sabishekkrishna/grade-app:v1.0
        imagePullPolicy: Always